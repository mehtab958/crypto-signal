name: Build cTrader bot

on:
  push:
    branches: [cbot]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Build
        shell: bash
        run: |
          dotnet build QuickScalper/QuickScalper.csproj --configuration Release -p:IncludeSource=True
          dotnet build HedgeGrid/HedgeGrid.csproj --configuration Release -p:IncludeSource=True
          dotnet build HedgeRecovery/HedgeRecovery.csproj --configuration Release -p:IncludeSource=True
          dotnet build RajaSnR/RajaSnR.csproj --configuration Release -p:IncludeSource=True
          dotnet build VsaBot/VsaBot.csproj --configuration Release -p:IncludeSource=True
      - name: Collect .algo files
        shell: bash
        run: |
          mkdir -p out
          for bot in QuickScalper HedgeGrid HedgeRecovery RajaSnR VsaBot; do
            found=$(find "$bot/bin" -name "*.algo" | head -n 1)
            if [ -z "$found" ]; then found=$(find "$USERPROFILE/Documents" -name "$bot*.algo" | head -n 1); fi
            if [ -z "$found" ]; then echo "No .algo file was produced for $bot"; exit 1; fi
            cp "$found" "out/$bot.algo"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: bots
          path: out/*.algo
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "cbot-${{ github.run_number }}" out/QuickScalper.algo out/HedgeGrid.algo out/HedgeRecovery.algo out/RajaSnR.algo out/VsaBot.algo --title "cTrader bots (build ${{ github.run_number }})" --notes "Open the .algo files on your phone with the cTrader app. Test on a demo account first." --target "${{ github.sha }}"
