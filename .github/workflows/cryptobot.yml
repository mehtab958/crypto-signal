name: Binance paper bot

on:
  schedule:
    - cron: "3-59/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cryptobot/**", ".github/workflows/cryptobot.yml"]

permissions:
  contents: write

concurrency:
  group: cryptobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Run paper bot
        run: |
          python3 cryptobot/bot.py site/crypto
          cp cryptobot/index.html site/crypto/index.html
      - name: Publish results
        run: |
          cd site
          git config user.name "cryptobot"
          git config user.email "cryptobot@users.noreply.github.com"
          git add crypto
          git diff --cached --quiet && exit 0
          git commit -q -m "cryptobot: update paper results"
          git push || (git pull --rebase -q && git push) || (sleep 5 && git pull --rebase -q && git push)
