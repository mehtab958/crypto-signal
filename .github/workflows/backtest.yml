name: Gold strategy backtest (Raja + VSA)

on:
  push:
    branches: [backtest]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Backtest
        run: cd backtest && python3 bt2.py 95
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest/*.py
