name: Memecoin paper bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["memebot/**", ".github/workflows/memebot.yml"]

permissions:
  contents: write

concurrency:
  group: memebot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Run paper bot
        run: |
          python3 memebot/bot.py site/meme
          cp memebot/index.html site/meme/index.html
      - name: Publish results
        run: |
          cd site
          git config user.name "memebot"
          git config user.email "memebot@users.noreply.github.com"
          git add meme
          git diff --cached --quiet && exit 0
          git commit -q -m "memebot: update paper results"
          git push || (git pull --rebase -q && git push) || (sleep 5 && git pull --rebase -q && git push)
